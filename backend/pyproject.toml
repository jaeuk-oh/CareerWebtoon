[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "careercraft-backend"
version = "0.1.0"
description = "AI Career Copilot - FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "supabase>=2.8.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
    "pypdf>=4.3.0",
    "python-docx>=1.1.0",
    "PyJWT>=2.8.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
